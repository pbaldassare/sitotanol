<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>TANOL Media</title>
<!-- First visit: browser language; afterwards the "lang" cookie set by the site. Paths without a language get one prepended. -->
<script>(function(){var L=["it","en","cs"],p=location.pathname,s=p.split("/")[1];if(L.indexOf(s)>=0)return;var c=(document.cookie.match(/(?:^|; )lang=(it|en|cs)(?:;|$)/)||[])[1];var n=(navigator.languages||[navigator.language||""]).map(function(x){return String(x).slice(0,2).toLowerCase()}).filter(function(x){return L.indexOf(x)>=0})[0];location.replace("/"+(c||n||"it")+(p==="/"?"":p)+location.search+location.hash)})()</script>
<style>body{margin:0;min-height:100vh;display:grid;place-items:center;background:#F8FAFC;color:#1E293B;font:600 1.0625rem/1.6 system-ui,sans-serif}a{color:#2563EB;margin:0 12px;display:inline-block;min-height:44px;line-height:44px}</style>
</head>
<body>
<nav aria-label="Lingua / Language / Jazyk"><a href="/it" hreflang="it">Italiano</a><a href="/en" hreflang="en">English</a><a href="/cs" hreflang="cs">Čeština</a></nav>
</body>
</html>
